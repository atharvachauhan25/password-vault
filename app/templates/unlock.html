{% extends "base.html" %}
{% block title %}Unlock Vault - Password Vault{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-lock-fill fs-1 text-warning"></i>
                    <h3 class="mt-2">Unlock Vault</h3>
                    {% if expired %}
                    <div class="alert alert-warning py-2 mt-3">
                        <i class="bi bi-clock-history"></i> Session expired due to inactivity.
                    </div>
                    {% else %}
                    <p class="text-secondary">Enter your master password to continue.</p>
                    {% endif %}
                </div>

                <form method="POST" action="{{ url_for('auth.unlock') }}" id="unlockForm">
                    <div class="mb-3">
                        <label for="password" class="form-label">Master Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password"
                                   name="password" required autofocus>
                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="toggleVisibility()">
                                <i class="bi bi-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning w-100" id="submitBtn">
                        <i class="bi bi-unlock-fill"></i> Unlock
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function toggleVisibility() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    // Loading state on submit
    document.getElementById('unlockForm').addEventListener('submit', () => {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Unlocking...';
    });
</script>
{% endblock %}
